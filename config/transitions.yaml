transition_rules:
  - condition: "sentiment:frustrated AND time:night"
    target: "punk-philosopher"
    weight_boost: 0.8
    reason: "Late night frustration needs deconstruction"

  - condition: "stream_segment:gaming AND sentiment:hype"
    target: "choom"
    weight_boost: 0.9
    reason: "Gaming hype = CHOOM time"

  - condition: "stream_segment:coding AND sentiment:technical"
    target: "cyber-zen"
    weight_boost: 0.8
    reason: "Deep code focus = CYBER-ZEN mode"

  - condition: "keywords:contains(gene keys,shadow,gift,siddhi,64 gates)"
    target: "nova"
    weight_boost: 0.9
    reason: "Gene Keys language triggers NOVA"

  - condition: "sentiment:intense"
    target: "baki"
    weight_boost: 0.7
    reason: "Intensity calls BAKI"

  - condition: "sentiment:chill AND time:evening"
    target: "tropical-infinity"
    weight_boost: 0.6
    reason: "Evening chill = Tropical vibes"

  - condition: "sentiment:creative AND sentiment:hype"
    target: "monkey-mind"
    weight_boost: 0.7
    reason: "Creative hype = Monkey-Mind time"

  - condition: "sentiment:deep AND time:night"
    target: "punk-philosopher"
    weight_boost: 0.5
    reason: "Late night deep thoughts"

  - condition: "sentiment:chill AND keywords:contains(foss,libre,open source)"
    target: "vapor-foss"
    weight_boost: 0.8
    reason: "FOSS talk = VAPOR-FOSS mode"

  - condition: "sentiment:practical"
    target: "godfather"
    weight_boost: 1.5
    reason: "Practical/business talk = GODFATHER mode"

  - condition: "sentiment:personal_support"
    target: "tropical-infinity"
    weight_boost: 1.0
    reason: "User needs support = TROPICAL-INFINITY"

  - condition: "keywords:contains(discipline,mastery,way,honor)"
    target: "samurai"
    weight_boost: 0.8
    reason: "Warrior code = SAMURAI mode"

cooldowns:
  min_transition_interval: 30
  min_seconds_between_same_persona: 120
  min_messages_before_transition: 3