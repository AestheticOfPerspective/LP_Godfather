services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: lp-godfather-tailscale
    hostname: lp-godfather-beast
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=lp-godfather-beast
      - TS_ACCEPT_DNS=true
      - TS_EXTRA_ARGS=--advertise-tags=tag:bot,tag:beast
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped

  godfather:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: lp-godfather
    hostname: lp-godfather
    env_file:
      - ../.env
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
    environment:
      - OLLAMA_PRIMARY_URL=http://beast-ollama:11434
      - OLLAMA_SECONDARY_URL=http://lp-godfather-tiger:11434
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - tailscale
    network_mode: "service:tailscale"
    restart: unless-stopped
