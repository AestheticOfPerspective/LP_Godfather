services:
  godfather-bot:
    build: .
    container_name: godfather-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MODE=telegram
      - OLLAMA_HOST=http://beast-ollama:11434
      - WHISPER_DEVICE=cpu
    volumes:
      - ./data:/app/data
    networks:
      - lp_godfather_deploy_default
      - beast-offline-ai_offline-ai

  twitch-bot:
    profiles:
      - twitch
    build: .
    container_name: godfather-twitch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_MODE=twitch
      - OLLAMA_HOST=http://beast-ollama:11434
      - WHISPER_DEVICE=cpu
    volumes:
      - ./data:/app/data
    networks:
      - lp_godfather_deploy_default
      - beast-offline-ai_offline-ai

networks:
  lp_godfather_deploy_default:
    driver: bridge
  beast-offline-ai_offline-ai:
    external: true
