version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU-Support (auskommentieren wenn keine NVIDIA GPU):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  godfather-bot:
    build: .
    container_name: godfather-bot
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      - BOT_MODE=telegram
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./data:/app/data

  twitch-bot:
    profiles:
      - twitch
    build: .
    container_name: godfather-twitch
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      - BOT_MODE=twitch
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
