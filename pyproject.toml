[project]
name = "lp-godfather"
version = "4.0.0"
description = "LP_GodFather v4 — Edgerunner Flowing Persona Engine"
authors = [{name = "Omarchy Media", email = "choom@liveplay.tv"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21,<22",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "psutil>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
godfather = "src.main:main"

[dependency-groups]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-httpx>=0.30"]

[tool.setuptools.packages.find]
where = ["."]
